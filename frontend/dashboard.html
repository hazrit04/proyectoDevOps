<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mis Tareas</title>
  <link rel="icon" type="image/png" href="assets/panda.png">
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Mis Tareas</h2>
    <button class="btn btn-danger" onclick="logout()">Cerrar sesión</button>
  </div>

  <form id="task-form" class="mb-4">
    <div class="row g-2">
      <div class="col-md-4">
        <input type="text" class="form-control" id="title" placeholder="Título de la tarea" required>
      </div>
      <div class="col-md-6">
        <input type="text" class="form-control" id="description" placeholder="Descripción" required>
      </div>
      <div class="col-md-2">
        <button class="btn btn-success">Agregar</button>
      </div>
    </div>
  </form>

  <table class="table table-striped" id="tasks-table">
    <thead>
      <tr>
        <th>Título</th>
        <th>Descripción</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tasks-body">
      <!-- Tareas se renderizan aquí -->
    </tbody>
  </table>

  <script src="js/api.js"></script>
  <script src="js/tasks.js"></script>
</body>
</html>
